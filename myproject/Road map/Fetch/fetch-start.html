<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Fetch starting point</title>

    <style>
      html,
      pre {
        font-family: sans-serif;
      }

      body {
        width: 500px;
        margin: 0 auto;
        background-color: #ccc;
      }

      pre {
        line-height: 1.5;
        letter-spacing: 0.05rem;
        padding: 1rem;
        background-color: white;
      }

      label {
        width: 200px;
        margin-right: 33px;
      }

      select {
        width: 350px;
        padding: 5px;
      }
    </style>
  </head>

  <body>
    <h1>Fetch starting point</h1>

    <form>
      <label for="verse-choose">Choose a verse</label>
      <select id="verse-choose" name="verse-choose">
        <option>Verse 1</option>
        <option>Verse 2</option>
        <option>Verse 3</option>
        <option>Verse 4</option>
      </select>
    </form>

    <h2>The Conqueror Worm, <em>Edgar Allen Poe, 1843</em></h2>

    <pre></pre>

    <script>
    


const verseChoose = document.querySelector("select");
const poemDisplay = document.querySelector("pre");

verseChoose.addEventListener("change", function () {
  updateDisplay(verseChoose.value);
});

function updateDisplay(value) {

  // Convert "Verse 1" to "verse1.txt"
  let verse = value.toLowerCase();
  verse = verse.replace(" ", "");

  const url = `${verse}.txt`;

  // Fetch the text file
  fetch(url)

    .then((response) => {

      if (!response.ok) {
        throw new Error(`HTTP error: ${response.status}`);
      }

      return response.text();
    })

    .then((text) => {
      poemDisplay.textContent = text;
    })

    .catch((error) => {
      poemDisplay.textContent = `Could not fetch verse: ${error}`;
    });

}

// Load Verse 1 automatically when page opens
updateDisplay("Verse 3const search = document.querySelector('.username-input');
const button = document.querySelector('.search-btn');
const errorMessage = document.querySelector('.error-message');

button.addEventListener('click', () => {
  checkUsername();
});

function checkUsername() {
  
  const username = search.value;
  
  if (!username.trim()) {
    errorMessage.textContent = "Please enter username";
    return;
  }
  
  errorMessage.textContent = '';
  
  console.log(username);
}""");
verseChoose.value = "Verse 1";



      
    </script>
  </body>
</html>
